name: CI

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24's npm 11 matches what edits package-lock.json locally;
          # npm 10 (Node 22) rejects npm 11-written lockfiles (@emnapi entries)
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
